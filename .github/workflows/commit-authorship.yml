name: Commit authorship

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Human-authored commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Reject bot and AI-agent authorship
        env:
          NATIVR_COMMIT_RANGE:
            ${{ github.event.pull_request.base.sha || github.event.before }}..${{
            github.event.pull_request.head.sha || github.sha }}
        run: node scripts/check-commit-authors.mjs
