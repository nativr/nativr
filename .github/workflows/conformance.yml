name: R differential conformance

on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

jobs:
  oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm conformance
      - run: pnpm conformance:r
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conformance-assets
          path: |
            conformance/cases/
            packages/parser/assets/manifest.json
          retention-days: 14
