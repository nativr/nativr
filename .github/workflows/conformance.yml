name: R differential conformance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "conformance/**"
      - "packages/ast/**"
      - "packages/base/**"
      - "packages/nativr/**"
      - "packages/package-tools/**"
      - "packages/parser/**"
      - "packages/runtime/**"
      - "scripts/run-conformance.mjs"
      - "scripts/run-r-conformance.mjs"
      - "scripts/run-r-conformance-v2.mjs"
      - "compatibility/**"
      - ".github/workflows/conformance.yml"
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

jobs:
  oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.17.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
      - uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          r-version: "4.6.1"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm conformance
      - run: pnpm conformance:r
      - run: pnpm conformance:r:v2
      - name: Run pinned unchanged-package regression corpus
        run: pnpm exec vitest run packages/package-tools/test/external-package.test.ts
        env:
          NATIVR_EXTERNAL_PACKAGE_SMOKE: "1"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: conformance-assets
          path: |
            conformance/cases/
            packages/parser/assets/manifest.json
          retention-days: 14
