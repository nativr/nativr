name: Release

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Preview pending versions or publish an already human-versioned main branch
        required: true
        type: choice
        options:
          - preview
          - publish

concurrency:
  group: release-${{ github.event.inputs.mode }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preview:
    if: github.event.inputs.mode == 'preview' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.17.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Report pending release versions without committing
        run: pnpm changeset status

  publish:
    if: github.event.inputs.mode == 'publish' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.17.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Require human-authored reachable history
        run: node scripts/check-commit-authors.mjs --all
      - name: Refuse publishing while changesets still need a human version commit
        run: node scripts/check-release-ready.mjs
      - run: pnpm check
      - run: pnpm release
