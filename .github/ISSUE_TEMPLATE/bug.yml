name: Bug report
description: Report a reproducible NativR failure.
title: "[bug] "
labels: ["bug"]
body:
  - type: textarea
    id: source
    attributes:
      label: Minimal R source
      render: r
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed result, warning, or error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected documented behavior and evidence
      description: Include the reference version and compatibility level when relevant.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser, OS, NativR version, and execution mode
    validations:
      required: true
