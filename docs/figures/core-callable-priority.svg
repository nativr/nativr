<line x1="846.25" y1="152" x2="846.25" y2="459" stroke="#e2e8f0"/><text x="846.25" y="142" text-anchor="middle" class="tick">0.8%</text>
<line x1="1045" y1="152" x2="1045" y2="459" stroke="#e2e8f0"/><text x="1045" y="142" text-anchor="middle" class="tick">1.0%</text>
