<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1120" viewBox="0 0 1200 1120" role="img" aria-labelledby="title description">
<title id="title">Highest-reach GNU R core callables not available in NativR</title>
<desc id="description">The twenty highest download-weighted GNU R core callable names detected in CRAN reference-manual examples that are not present as NativR builtins or evaluator-native callable language forms.</desc>
<rect width="1200" height="1120" fill="#ffffff"/>
<style>
  text { font-family: Inter, "Segoe UI", Arial, sans-serif; fill: #0f172a; }
  .title { font-size: 30px; font-weight: 600; }
  .subtitle { font-size: 16px; fill: #475569; }
  .label { font-size: 16px; font-weight: 600; }
  .value { font-size: 14px; font-variant-numeric: tabular-nums; }
  .meta, .tick { font-size: 12px; fill: #64748b; }
  .legend { font-size: 14px; fill: #334155; }
  .note { font-size: 14px; fill: #475569; }
</style>

<text x="60" y="60" class="title">Highest-reach missing GNU R callables</text>
<text x="60" y="94" class="subtitle">97 analyzable manuals; ranked by download-weighted package reach</text>
<text x="60" y="122" class="legend">Red means the callable is absent from NativR builtins and evaluator-native callable language forms; behavioral completeness is stricter than availability.</text>
<line x1="250" y1="152" x2="250" y2="459" stroke="#e2e8f0"/><text x="250" y="142" text-anchor="middle" class="tick">0.0%</text>
