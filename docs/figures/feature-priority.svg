<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1070" viewBox="0 0 1200 1070" role="img" aria-labelledby="title description">
<title id="title">Data-backed NativR feature priorities</title>
<desc id="description">The fifteen highest-reach R feature gaps found in CRAN reference-manual examples, ranked by download-weighted package reach, with unweighted package reach as a secondary measure.</desc>
<rect width="1200" height="1070" fill="#ffffff"/>
<style>
  text { font-family: Inter, "Segoe UI", Arial, sans-serif; fill: #0f172a; }
  .title { font-size: 30px; font-weight: 600; }
  .subtitle { font-size: 16px; fill: #475569; }
  .label { font-size: 16px; font-weight: 600; }
  .value { font-size: 14px; font-variant-numeric: tabular-nums; }
  .meta, .tick { font-size: 12px; fill: #64748b; }
  .legend { font-size: 14px; fill: #334155; }
  .note { font-size: 14px; fill: #475569; }
</style>

